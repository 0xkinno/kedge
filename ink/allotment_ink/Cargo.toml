[package]
name = "allotment_ink"
version = "0.1.0"
edition = "2021"
authors = ["0xkinno"]
license = "MIT"

[dependencies]
ink = { version = "5.1.1", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = ["ink/std"]
ink-as-dependency = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
